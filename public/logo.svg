<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Outer gear teeth -->
  <g fill="#1e40af" stroke="#1e3a8a" stroke-width="0.5">
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(0, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(30, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(60, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(90, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(120, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(150, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(180, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(210, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(240, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(270, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(300, 100, 100)"/>
    <rect x="93" y="0" width="14" height="20" rx="3" transform="rotate(330, 100, 100)"/>
  </g>
  
  <!-- Inner gear ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8,6"/>
  
  <!-- Central gear icon -->
  <circle cx="100" cy="100" r="55" fill="url(#grad2)"/>
  
  <!-- Gear icon (stylized) -->
  <g transform="translate(100,100)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gear teeth (small) -->
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(0)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(45)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(90)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(135)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(180)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(225)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(270)"/>
    <path d="M0,-42 L5,-35 L-5,-35 Z" transform="rotate(315)"/>
    
    <!-- Gear body -->
    <circle cx="0" cy="0" r="32" stroke-width="4"/>
    <circle cx="0" cy="0" r="22" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="white" stroke="none"/>
    
    <!-- Gear spokes -->
    <line x1="0" y1="-22" x2="0" y2="-8" stroke-width="3"/>
    <line x1="0" y1="8" x2="0" y2="22" stroke-width="3"/>
    <line x1="-22" y1="0" x2="-8" y2="0" stroke-width="3"/>
    <line x1="8" y1="0" x2="22" y2="0" stroke-width="3"/>
  </g>
  
  <!-- KPM Text -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">KPM</text>
  
  <!-- Subtitle -->
  <text x="100" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="8" fill="#93c5fd" letter-spacing="3">PHARMA MACHINERY</text>
</svg>
